# US financial planners — major metros.
# Base runs the broad "financial planner" search; each variation pins a city.

name: us_realtors_cities

base:
  keywords: "realtor united states"
  region_code: US
  language: en
  max_results: 50
  order: relevance
  search_type: channel
  min_subscribers: 5000
  max_subscribers: 100000

