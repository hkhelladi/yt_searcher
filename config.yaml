# ─────────────────────────────────────────────────────────────
# YouTube Searcher – Search Configuration
# ─────────────────────────────────────────────────────────────
# API KEY
#   Required: YouTube Data API v3 key
#   Get one at: https://console.cloud.google.com/
#     → APIs & Services → Credentials → Create Credentials → API Key
#     → Then enable "YouTube Data API v3" in Library
#
# QUOTA COST REFERENCE (free tier = 10,000 units/day)
#   search.list call      : 100 units  (fetches up to 50 channel IDs)
#   channels.list call    :   1 unit   (batch of up to 50 channels, full details)
#   ─────────────────────────────────────────────────────────
#   Cost per search block :
#     • 50 results  →  100 + 1  =  101 units  (~99 searches/day free)
#     • 100 results →  200 + 2  =  202 units  (~49 searches/day free)
#     • 200 results →  400 + 4  =  404 units  (~24 searches/day free)
#   If you exceed 10,000 units/day, requests return 403 until midnight PT.
#   Paid quota: ~$0.20 per 10,000 units (enable billing in GCP).
# ─────────────────────────────────────────────────────────────


